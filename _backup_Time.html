<title>习录 · 每日学习计时</title>
<style>
/* ============ 静谧墨玉 · Quiet Jade ============ */
:root{
  /* ===== tokens：珠光底 + 墨色 + 翡翠青玉（唯一点缀） ===== */
  --paper:#F4F6F5;          /* 珠光雾白（微冷，显干净） */
  --paper-2:#EBEFEE;        /* 略深珠光 */
  --ink:#1E2623;            /* 墨玉黑绿（非纯黑） */
  --ink-soft:#333E39;
  --muted:#6B7A74;          /* 灰青 */
  --ink-2:var(--muted);
  --ink-3:#9CABA4;         /* 浅灰青 */
  --line:#D5DEDA;
  --hair:#E3E9E6;
  --hair-soft:#EEF2F0;
  --card:#FFFFFF;           /* 纯白卡片（干净） */
  --card-2:#F6F9F8;
  /* 主色：翡翠青玉 · 克制点缀，不铺满 */
  --accent:#1FA98C;         /* 翡翠青 */
  --accent-2:#14806A;       /* 深玉 */
  --accent-soft:rgba(31,169,140,.12);
  --accent-ring:rgba(31,169,140,.28);
  --danger:#D2607A;         /* 柔玫瑰（收工/删除） */
  --c-note:#5B8DEF;         /* 碎碎念 · 晴蓝 */
  --c-mile:#E0A93B;         /* 里程碑 · 琥珀金 */
  --c-interview:#C98BD4;    /* 面试计时 · 丁香紫 */
  --sans:"PingFang SC","HarmonyOS Sans SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono","SFMono-Regular",ui-monospace,Consolas,"Liberation Mono",monospace;
  --ease:cubic-bezier(.22,.61,.36,1);
  --ease-soft:cubic-bezier(.4,.14,.3,1);
  --r:20px;                 /* 全局圆角（更大更柔） */
  --r-sm:13px;
  --r-lg:28px;
  --shadow:0 12px 34px -16px rgba(30,50,45,.22);
  --shadow-sm:0 5px 16px -8px rgba(30,50,45,.18);
  --shadow-lg:0 28px 64px -20px rgba(30,50,45,.30);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{margin:0;min-height:100%}
body{
  color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  font-family:var(--sans);font-size:15px;line-height:1.65;
  overflow-x:hidden;
  background:
    radial-gradient(1100px 620px at 88% -12%,rgba(31,169,140,.08),transparent 58%),
    radial-gradient(820px 480px at -8% 108%,rgba(91,141,239,.06),transparent 55%),
    var(--paper);
}
/* 极淡的珠光竖向呼吸格 */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(90deg,rgba(40,70,62,.035) 1px,transparent 1px);
  background-size:96px 100%;
}
::selection{background:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
#app{position:relative;z-index:2;max-width:1240px;margin:0 auto;padding:40px 44px 64px;counter-reset:sec}

/* ============ 刊头 · Masthead ============ */
header{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:24px;
  padding:22px 30px;margin-bottom:14px;
  position:relative;border-radius:var(--r-lg);
  background:linear-gradient(135deg,rgba(255,255,255,.92) 0%,rgba(246,249,248,.78) 100%);
  backdrop-filter:blur(12px);
  box-shadow:var(--shadow);
  border:1px solid var(--line);
}
header::before{content:"";position:absolute;left:30px;right:30px;top:0;height:3px;border-radius:0 0 6px 6px;
  background:linear-gradient(90deg,var(--accent),var(--c-mile),var(--c-note),var(--c-interview));opacity:.85}
.brand{display:flex;align-items:center;gap:16px}
.brand .seal{
  width:52px;height:52px;flex:none;border-radius:16px;
  background:linear-gradient(145deg,var(--accent),var(--accent-2));color:#fff;font-size:27px;font-weight:800;
  display:flex;align-items:center;justify-content:center;letter-spacing:0;
  box-shadow:0 8px 18px -6px rgba(31,169,140,.5);
}
.brand .bt{line-height:1.15}
.brand .bt h1{font-size:30px;font-weight:800;letter-spacing:.18em;color:var(--ink)}
.brand .bt .en{font-family:var(--mono);font-size:10px;letter-spacing:.32em;color:var(--ink-3);text-transform:uppercase;margin-top:5px}
.date-now{justify-self:end;text-align:right;line-height:1.18;white-space:nowrap}
.date-now .dd{font-family:var(--mono);font-size:28px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.date-now .dd b{font-weight:600;color:var(--ink);opacity:.26;margin:0 3px}
.date-now .md{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--ink-3);margin-top:4px;text-transform:uppercase}
nav{display:flex;gap:4px;padding:4px;background:rgba(255,255,255,.6);border-radius:999px;flex:none;border:1px solid var(--line)}
nav button{
  border:none;background:transparent;font-family:var(--sans);font-size:14px;font-weight:600;
  padding:9px 24px;border-radius:999px;cursor:pointer;color:var(--ink-2);letter-spacing:.14em;
  transition:background .2s var(--ease-soft),color .2s,box-shadow .2s,transform .2s;
}
nav button+button{border-left:none}
nav button:not(.on):hover{background:var(--card);color:var(--ink)}
nav button.on{
  background:linear-gradient(140deg,var(--accent),var(--accent-2));
  color:#fff;font-weight:800;box-shadow:0 6px 16px -6px rgba(31,169,140,.55);
}

/* ============ 分栏标题 · 编号 + 细规 ============ */
.sec{
  counter-increment:sec;
  display:flex;align-items:center;gap:14px;margin:40px 0 16px;
  font-family:var(--mono);font-size:11px;font-weight:700;
  letter-spacing:.24em;color:var(--ink);text-transform:uppercase;
}
.sec .tag{display:none}
.sec::before{
  content:counter(sec,decimal-leading-zero);
  background:var(--accent-soft);color:var(--accent-2);padding:3px 8px;font-size:10.5px;letter-spacing:.06em;
  border-radius:7px;font-weight:800;
}
.sec .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.sec .sub{font-family:var(--sans);font-weight:400;letter-spacing:.02em;color:var(--ink-3);font-size:11.5px}

/* ============ 今日布局 ============ */
.today-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:34px;align-items:start}
.rv-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:28px;align-items:start}

/* --- 时辰卡 --- */
.clock-card{
  background:linear-gradient(160deg,rgba(255,255,255,.95) 0%,rgba(246,249,248,.85) 100%);
  border:1px solid var(--line);
  padding:28px 34px 22px;position:relative;overflow:hidden;
  border-radius:var(--r-lg);
  box-shadow:var(--shadow);
  transition:box-shadow .35s var(--ease),transform .35s var(--ease);
  animation:riseUp .52s var(--ease) backwards;
}
.clock-card.run{animation:riseUp .52s var(--ease) backwards,glowPulse 3.4s ease-in-out infinite;animation-delay:0s,0s}
.clock-card.run .clock-big{text-shadow:0 0 32px color-mix(in srgb,var(--cc,var(--accent)) 42%,transparent)}
.clock-card::before{
  content:"";position:absolute;inset:0 0 auto 0;height:4px;
  background:linear-gradient(90deg,var(--cc,var(--accent)),color-mix(in srgb,var(--cc,var(--accent)) 55%,#fff));
  transition:background .35s var(--ease);
}
.clock-head{display:flex;align-items:center;gap:12px;min-height:24px}
.pulse{width:11px;height:11px;border-radius:50%;background:var(--accent);flex:none;box-shadow:0 0 0 4px var(--accent-soft)}
.pulse.run{background:var(--cc,var(--danger));box-shadow:0 0 0 4px color-mix(in srgb,var(--cc,var(--danger)) 25%,transparent);animation:blink 1.3s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
/* 进场 / 视图过渡 */
@keyframes riseUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes glowPulse{0%,100%{box-shadow:var(--shadow),0 0 54px -22px color-mix(in srgb,var(--cc,var(--accent)) 55%,transparent)}50%{box-shadow:var(--shadow),0 0 74px -18px color-mix(in srgb,var(--cc,var(--accent)) 75%,transparent)}}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s!important;animation-delay:0s!important}
  .view{animation:none!important}
}
.clock-state-txt{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--ink-2);font-weight:600;text-transform:uppercase}
.clock-state-txt .sub-name{color:var(--accent-2);background:var(--accent-soft);padding:1px 8px;border-radius:6px;font-weight:700;margin-left:2px}
.stop-btn{
  margin-left:auto;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:6px 16px;font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;
  cursor:pointer;transition:all .18s var(--ease-soft);display:none;text-transform:uppercase;border-radius:999px;
}
.stop-btn.show{display:inline-flex;align-items:center;gap:8px}
.stop-btn.show::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--cc,var(--danger))}
.stop-btn:hover{background:var(--cc,var(--danger));color:#fff;border-color:var(--cc,var(--danger));box-shadow:var(--shadow-sm);transform:translateY(-1px)}
.clock-big{
  font-family:var(--mono);font-size:clamp(58px,8.2vw,120px);line-height:.94;letter-spacing:-.04em;
  margin:18px 0 8px;font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink);
}
.clock-big.idle{color:var(--ink-3)}
.clock-sub{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);letter-spacing:.03em;min-height:20px}
.clock-sub b{color:var(--accent-2);font-weight:700;background:var(--accent-soft);padding:0 6px;border-radius:5px}

/* --- 时辰刻度仪 --- */
.rail-wrap{position:relative;margin:28px 0 6px;padding-top:26px}
.rail-cap{
  position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:baseline;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--ink-3);text-transform:uppercase;
}
.rail-cap .r{margin-left:auto;color:var(--ink);font-weight:700;letter-spacing:.08em}
#hourRail{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;height:96px}
.hx{position:relative;background:var(--paper-2);overflow:hidden;border-radius:4px}
.hx .stack{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end}
.hx .seg{min-height:2px;border-radius:1px 1px 0 0}
#railNow{
  position:absolute;top:26px;bottom:23px;width:0;z-index:3;pointer-events:none;
  border-left:2px solid var(--accent);opacity:0;transition:opacity .3s;
}
#railNow .c{position:absolute;top:-6px;left:-6px;width:11px;height:11px;border-radius:50%;
  background:var(--accent);border:2px solid var(--card);box-shadow:0 2px 6px -1px rgba(31,169,140,.7)}
.rail-ticks{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;height:18px;margin-top:6px}
.rail-ticks span{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;
  display:flex;align-items:flex-start;justify-content:center;position:relative}
.rail-ticks span.k::before{content:"";position:absolute;top:0;left:50%;width:1px;height:5px;background:var(--hair)}
.rail-ticks span.m{color:var(--ink);font-weight:700}

/* --- 事项 --- */
.subj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px;margin-top:2px}
.subj{
  --c:#8FA6A2;
  background:var(--card);border:1px solid var(--line);
  padding:16px 18px 15px 20px;cursor:pointer;position:relative;border-radius:var(--r);
  box-shadow:var(--shadow-sm);
  transition:transform .16s var(--ease),box-shadow .2s var(--ease),border-color .2s,background .2s;
  text-align:left;font-family:inherit;color:inherit;
}
.subj::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:5px;border-radius:3px;background:var(--c);transition:background .2s}
.subj:hover{border-color:var(--c);box-shadow:0 12px 26px -14px color-mix(in srgb,var(--c) 70%,transparent);transform:translateY(-2px)}
.subj:active{transform:translateY(0);box-shadow:var(--shadow-sm)}
.subj .nm{font-size:16px;color:var(--ink);font-weight:700;display:block;letter-spacing:.02em}
.subj .tm{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-top:10px;letter-spacing:.02em;display:flex;align-items:center;gap:7px}
.subj .tm b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;font-size:13.5px}
.subj .wk{display:block;margin-top:4px;font-family:var(--mono);font-size:10px;color:var(--ink-2);letter-spacing:.02em}
.subj.on{
  border:1px solid color-mix(in srgb,var(--c) 60%,#fff);
  background:linear-gradient(150deg,var(--c),color-mix(in srgb,var(--c) 78%,#000 6%));
  box-shadow:0 16px 34px -14px color-mix(in srgb,var(--c) 80%,transparent);
  transform:translateY(-2px);
}
.subj.on::before{display:none}
.subj.on .nm{color:#fff}
.subj.on .tm,.subj.on .tm b{color:rgba(255,255,255,.95)}
.subj.on .wk{color:rgba(255,255,255,.78)}
.subj.on .nm::after{
  content:"计时中";display:inline-block;margin-left:8px;vertical-align:2px;
  font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.08em;color:var(--c);
  background:#fff;padding:1px 7px;border-radius:5px;animation:blink 1.6s ease-in-out infinite;
}
.subj .x{
  display:none;position:absolute;top:10px;right:12px;border:none;background:none;z-index:2;
  color:var(--ink-3);font-size:13px;cursor:pointer;font-family:var(--sans);line-height:1;
}
.subj .x:hover{color:var(--danger)}
.subj.on .x{color:rgba(255,255,255,.85)}
.managing .subj .x{display:block}
.subj.add{
  border:1.5px dashed var(--line);color:var(--ink-2);background:transparent;
  display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;
  min-height:102px;
}
.subj.add::before{display:none}
.subj.add:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-2);box-shadow:var(--shadow-sm);transform:translateY(-2px)}
/* 事项卡底部 · 近 7 日迷你趋势 */
.spark{display:flex;align-items:flex-end;gap:3px;height:22px;margin-top:13px}
.spark i{flex:1;min-height:3px;background:var(--c);opacity:.3;border-radius:2px;transition:height .35s var(--ease),opacity .2s}
.spark i.on{opacity:.85}
.spark i:only-child,.spark i:first-child{border-bottom-left-radius:2px}
.subj.add .plus{font-size:24px;line-height:1;font-weight:700}
.subj.add .lbl{font-size:10.5px;letter-spacing:.18em;font-family:var(--mono);font-weight:700}

/* 新增事项编辑条 */
.subj-edit{
  display:none;gap:10px;align-items:center;margin-top:14px;
  background:var(--card-2);border:1px solid var(--line);padding:14px 16px;border-radius:var(--r);
  box-shadow:var(--shadow-sm);
}
.subj-edit.show{display:flex;flex-wrap:wrap}
.subj-edit input[type=text]{
  border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:var(--r-sm);
  font-family:var(--sans);font-size:14px;color:var(--ink);width:180px;outline:none;transition:border-color .15s,box-shadow .15s;
}
.subj-edit input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:24px;height:24px;cursor:pointer;border:2px solid transparent;border-radius:50%;flex:none;transition:transform .12s}
.sw:hover{transform:scale(1.12)}
.sw.pick{border-color:var(--ink);box-shadow:0 0 0 2px #fff inset,0 0 0 3px var(--accent-ring)}
.ghost{
  border:1px solid var(--line);background:#fff;padding:8px 18px;border-radius:999px;
  font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.08em;cursor:pointer;
  color:var(--ink);transition:all .18s var(--ease-soft);
}
.ghost:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-2)}
.ghost.primary{background:linear-gradient(140deg,var(--accent),var(--accent-2));color:#fff;border-color:transparent}
.ghost.primary:hover{filter:brightness(1.05);box-shadow:0 8px 18px -8px rgba(31,169,140,.55)}
.ghost.danger:hover{background:var(--danger);border-color:var(--danger);color:#fff}

/* --- 面板 --- */
.panel{background:linear-gradient(160deg,rgba(255,255,255,.92),rgba(246,249,248,.82));backdrop-filter:blur(10px);border:1px solid var(--line);padding:20px 22px 18px;position:relative;border-radius:var(--r);box-shadow:var(--shadow);animation:riseUp .52s var(--ease) backwards}
.panel .phead{
  display:flex;align-items:center;gap:10px;margin-bottom:8px;padding-bottom:10px;
  border-bottom:1px solid var(--hair);
  font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.22em;color:var(--ink);
}
.panel .phead::before{content:"";width:9px;height:9px;border-radius:3px;background:linear-gradient(145deg,var(--accent),var(--accent-2));flex:none;box-shadow:0 0 0 3px var(--accent-soft)}
.panel .phead .rule{display:none}
.phead .linkbtn{
  border:1px solid var(--line);background:rgba(255,255,255,.7);color:var(--ink-2);font-family:var(--mono);font-size:10.5px;
  font-weight:700;cursor:pointer;letter-spacing:.08em;padding:4px 11px;text-decoration:none;flex:none;margin-left:auto;border-radius:999px;
  transition:all .18s var(--ease-soft);
}
.phead .linkbtn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

/* 时段流水 */
#sessList{list-style:none}
.sess{display:flex;align-items:center;gap:11px;padding:11px 4px;position:relative;border-radius:var(--r-sm);transition:background .15s}
.sess:hover{background:var(--card-2)}
.sess::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--c,#8FA6A2);opacity:.55;transition:opacity .15s}
.sess+.sess{border-top:1px dashed var(--hair)}
.sess .c{width:10px;height:10px;border-radius:3px;background:var(--c,#8FA6A2);flex:none}
.sess .rng{font-family:var(--mono);font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;flex:none;width:98px;letter-spacing:.02em}
.sess .who{font-size:15px;color:var(--ink);font-weight:600;letter-spacing:.02em}
.sess .dur{
  margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.04em;
  color:#fff;background:var(--c,#8FA6A2);padding:3px 10px;border-radius:999px;font-variant-numeric:tabular-nums;
}
.sess-del,.sess-edit{
  opacity:0;border:none;background:none;color:var(--ink-3);cursor:pointer;font-size:14px;
  font-family:var(--sans);padding:0 2px;transition:opacity .12s,color .12s;
}
.sess:hover .sess-del,.sess:hover .sess-edit{opacity:1}
.sess-del:hover{color:var(--danger)}
.sess-edit:hover{color:var(--ink)}
.sess.editing .sess-edit{opacity:1}
.sess.editing .rng{width:auto;display:flex;align-items:center;gap:5px}
.sess .tm{
  font-family:var(--mono);font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;
  border:1px solid var(--line);background:var(--card);padding:3px 6px;width:84px;outline:none;border-radius:var(--r-sm);transition:border-color .15s,box-shadow .15s;
}
.sess .tm:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.empty-hint{color:var(--ink-3);font-size:13.5px;padding:16px 4px;letter-spacing:.02em;line-height:1.9}
.empty-hint b{color:var(--accent-2);background:var(--accent-soft);padding:0 5px;border-radius:5px;font-weight:700}

/* 补录弹层 */
.add-back{
  position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
  background:rgba(28,40,36,.34);backdrop-filter:blur(3px);padding:24px;
  opacity:0;transition:opacity .2s var(--ease-soft);
}
.add-back.show{opacity:1}
.add-modal{
  width:min(520px,100%);background:linear-gradient(160deg,rgba(255,255,255,.96),rgba(246,249,248,.92));
  backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow-lg);padding:24px 26px 22px;position:relative;
  transform:translateY(14px) scale(.985);opacity:0;
  transition:transform .26s var(--ease),opacity .26s var(--ease-soft);
}
.add-back.show .add-modal{transform:none;opacity:1}
.am-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.am-ttl{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.22em;color:var(--ink)}
.am-x{border:1px solid var(--line);background:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;
  color:var(--ink-2);font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;transition:all .15s}
.am-x:hover{background:var(--danger);border-color:var(--danger);color:#fff}
.am-field{margin-bottom:18px}
.am-lab{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.16em;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.am-hint{font-family:var(--sans);font-weight:400;letter-spacing:.02em;font-size:11px;color:var(--ink-3);text-transform:none}
/* 科目色片 */
.sub-chips{display:flex;flex-wrap:wrap;gap:8px}
.schip{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);
  background:#fff;padding:7px 13px 7px 11px;border-radius:999px;cursor:pointer;
  font-family:var(--sans);font-size:13px;font-weight:600;color:var(--ink);
  border-left:4px solid var(--c,var(--line));transition:all .16s var(--ease-soft);
}
.schip .dot{width:9px;height:9px;border-radius:3px;background:var(--c);flex:none}
.schip:hover{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 14%,transparent)}
.schip.on{background:var(--c);color:#fff;border-color:var(--c)}
.schip.on .dot{border:1px solid rgba(255,255,255,.55)}
.schip.on:hover{box-shadow:0 6px 16px -8px var(--c)}
/* 24h 时间轴 */
.tl{user-select:none;-webkit-user-select:none;touch-action:none}
.tl-track{
  position:relative;height:54px;border-radius:14px;cursor:pointer;overflow:visible;
  background:linear-gradient(180deg,rgba(31,169,140,.06),rgba(31,169,140,.02));
  border:1px solid var(--hair);margin-bottom:9px;
}
.tl-segs{position:absolute;inset:0;border-radius:14px;overflow:hidden}
.tl-segs .seg{position:absolute;top:0;bottom:0;background:var(--c,#8FA6A2);opacity:.4}
.tl-now{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--danger);opacity:.7;left:0;display:none;z-index:4}
.tl-now::after{content:"";position:absolute;top:-3px;left:-2px;width:6px;height:6px;border-radius:50%;background:var(--danger)}
.tl-sel{
  position:absolute;top:0;bottom:0;background:linear-gradient(180deg,var(--accent-soft),rgba(31,169,140,.18));
  border:1px solid var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.4);z-index:3;
}
.tl-dur{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--accent-2);background:rgba(255,255,255,.88);padding:2px 9px;border-radius:999px;pointer-events:none}
.tl-h{position:absolute;top:-4px;bottom:-4px;width:22px;transform:translateX(-50%);z-index:6;cursor:grab;touch-action:none}
.tl-h:active{cursor:grabbing}
.tl-h i{position:absolute;top:0;bottom:0;left:50%;width:3px;transform:translateX(-50%);background:var(--accent);border-radius:3px;box-shadow:0 0 0 4px var(--accent-soft)}
.tl-h::before{content:"";position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--accent);transform:translate(-50%,-50%);box-shadow:0 2px 6px -1px rgba(30,50,45,.3);transition:transform .12s}
.tl-h:active::before{transform:translate(-50%,-50%) scale(1.12)}
.tl-t{position:absolute;bottom:-23px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--ink-2);white-space:nowrap;background:#fff;padding:1px 6px;border-radius:6px;border:1px solid var(--hair)}
.tl-ticks{display:flex;justify-content:space-between;padding:16px 0 2px;font-family:var(--mono);font-size:9.5px;color:var(--ink-3)}
.tl-ticks span{flex:1;text-align:center}
.tl-ticks .lab{color:var(--muted);font-weight:700}
.tl-read{margin-top:6px;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--ink);text-align:center}
.tl-warn{height:14px;margin-top:5px;text-align:center;font-size:11px;color:var(--c-mile);opacity:0;transition:opacity .15s}
.tl-warn.show{opacity:1}
/* 预设 */
.am-presets{display:flex;flex-wrap:wrap;gap:7px;margin:2px 0 20px}
.pre{border:1px dashed var(--line);background:var(--card-2);color:var(--muted);font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.04em;padding:6px 11px;border-radius:999px;cursor:pointer;transition:all .15s var(--ease-soft)}
.pre:hover{border-color:var(--accent);color:var(--accent-2);background:var(--accent-soft)}
.am-foot{display:flex;gap:10px}
.am-foot .ghost.primary{flex:1;background:linear-gradient(140deg,var(--c,var(--accent)),color-mix(in srgb,var(--c,var(--accent)) 68%,#0c2b24));border-color:transparent}
.am-foot .ghost.primary:hover{filter:brightness(1.05);box-shadow:0 8px 18px -8px var(--c,var(--accent))}
.drop-empty{padding:12px;font-family:var(--mono);font-size:11.5px;color:var(--ink-3);text-align:center;letter-spacing:.1em}
.linkbtn{
  border:none;background:none;color:var(--ink-3);font-family:var(--mono);font-size:11.5px;
  cursor:pointer;letter-spacing:.08em;padding:4px 6px;border-radius:6px;transition:all .15s;
}
.linkbtn:hover{color:var(--accent-2);background:var(--accent-soft)}

/* 札记 */
#evList{list-style:none}
.ev{display:flex;align-items:flex-start;gap:11px;padding:11px 4px;position:relative;border-radius:var(--r-sm);transition:background .15s}
.ev:hover{background:var(--card-2)}
.ev+.ev{border-top:1px dashed var(--hair-soft)}
.ev .stamp{
  width:10px;height:10px;flex:none;margin-top:6px;cursor:pointer;border-radius:3px;
  background:transparent;border:1.5px solid var(--ink-3);transition:all .15s;
}
.ev.k-mile .stamp{background:var(--c-mile);border-color:var(--c-mile);transform:rotate(45deg)}
.ev.k-note .stamp{background:var(--c-note);border-color:var(--c-note)}
.ev.k-mile .txt{font-weight:700}
.evgrp{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--ink-3);font-weight:700;
  padding:13px 4px 0;text-transform:uppercase;display:flex;align-items:center;
}
.evgrp.g-mile{color:var(--c-mile)}
.evgrp.g-note{color:var(--c-note)}
.evgrp::before{
  content:"";display:inline-block;width:7px;height:7px;background:var(--ink-3);
  border:1px solid var(--ink);margin-right:7px;vertical-align:1px;border-radius:2px;
}
.evgrp.g-mile::before{background:var(--c-mile);transform:rotate(45deg)}
.evgrp.g-note::before{background:var(--c-note)}
.evgrp:not(:first-child){margin-top:5px;border-top:1px dashed var(--hair-soft);padding-top:11px}
.evgrp+.ev{border-top:none}
.ev .bdy{flex:1;min-width:0}
.ev .txt{font-size:15px;color:var(--ink);line-height:1.6;letter-spacing:.01em}
.ev .t{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:3px;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.ev .del{border:none;background:none;color:var(--ink-3);cursor:pointer;font-size:14px;opacity:0;font-family:var(--sans);transition:color .15s}
.ev:hover .del{opacity:1}
.ev .del:hover{color:var(--danger)}
.evadd{display:flex;gap:9px;margin-top:11px;padding-top:14px}
.evkind{display:flex;gap:7px;margin-top:12px;border-top:1px dashed var(--hair);padding-top:13px}
.kbtn{
  border:1px solid var(--line);background:#fff;padding:5px 14px;border-radius:999px;
  font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:var(--ink-2);cursor:pointer;
  transition:all .18s var(--ease-soft);
}
.kbtn:hover{border-color:var(--ink-2);color:var(--ink)}
.kbtn[data-k="note"]{color:var(--c-note);border-color:color-mix(in srgb,var(--c-note) 50%,var(--line))}
.kbtn[data-k="mile"]{color:var(--c-mile);border-color:color-mix(in srgb,var(--c-mile) 50%,var(--line))}
.kbtn.pick{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.kbtn.pick[data-k="note"]{background:var(--c-note);border-color:var(--c-note)}
.kbtn.pick[data-k="mile"]{background:var(--c-mile);border-color:var(--c-mile)}
.evadd input{
  flex:1;border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:999px;
  font-family:var(--sans);font-size:14.5px;color:var(--ink);outline:none;transition:border-color .2s,box-shadow .2s;
}
.evadd input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.evadd button{
  border:1px solid var(--c-note);background:var(--c-note);color:#fff;padding:0 22px;border-radius:999px;
  font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.14em;cursor:pointer;
  transition:all .18s var(--ease-soft);
}
.evadd button:hover{filter:brightness(1.06);box-shadow:0 8px 18px -8px color-mix(in srgb,var(--c-note) 70%,transparent)}

/* ============ 回顾 ============ */
.view{animation:viewIn .42s var(--ease-soft) both}
.view.review{display:none}
.review-banner{
  display:flex;align-items:baseline;gap:18px;margin:14px 0 26px;padding:22px 28px;flex-wrap:wrap;
  background:linear-gradient(135deg,rgba(255,255,255,.92),rgba(246,249,248,.82));
  backdrop-filter:blur(12px);
  border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);
  animation:riseUp .52s var(--ease) backwards;
}
.review-banner .rb-t{font-size:28px;font-weight:800;letter-spacing:.14em;color:var(--ink);line-height:1}
.review-banner .rb-t small{font-family:var(--mono);font-size:12px;color:var(--ink-3);letter-spacing:.14em;margin-left:12px;font-weight:600}
.review-stats{display:flex;margin-bottom:28px;border:1px solid var(--line);
  background:linear-gradient(160deg,rgba(255,255,255,.95),rgba(246,249,248,.85));
  backdrop-filter:blur(10px);box-shadow:var(--shadow);overflow:hidden;border-radius:var(--r-lg)}
.stat{flex:1;padding:20px 24px;position:relative;min-width:0}
.stat+.stat{border-left:1px solid var(--hair)}
.stat .k{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.22em;color:var(--ink-2);text-transform:uppercase}
.stat .v{font-family:var(--mono);font-size:38px;font-variant-numeric:tabular-nums;margin-top:8px;color:var(--ink);font-weight:700;line-height:1;letter-spacing:-.03em}
.stat .v small{font-size:14px;color:var(--ink-3);font-weight:400;margin-left:3px}
.stat .d{font-family:var(--mono);font-size:11px;color:var(--ink-2);margin-top:8px;letter-spacing:.04em}
.cal-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--hair)}
.cal-head .mo{font-size:22px;font-weight:800;letter-spacing:.08em;font-family:var(--mono)}
.cal-head .mv{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--accent-2);letter-spacing:.1em;font-weight:700;background:var(--accent-soft);padding:4px 11px;border-radius:999px}
.cal-head button{
  border:1px solid var(--line);background:#fff;width:34px;height:34px;cursor:pointer;border-radius:50%;
  color:var(--ink);font-size:16px;transition:all .18s var(--ease-soft);
}
.cal-head button:hover{background:var(--accent);color:#fff;border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--ink-2);text-align:center;padding:4px 0;border-bottom:1px solid var(--hair);margin-bottom:4px}
.cd{
  aspect-ratio:1.1;border:1px solid var(--hair);background:var(--card);border-radius:var(--r-sm);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;position:relative;
  transition:transform .16s var(--ease),box-shadow .18s var(--ease),border-color .18s;
}
.cd:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm);border-color:var(--accent)}
.cd .n{font-family:var(--mono);font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;font-weight:600}
.cd .h{font-family:var(--mono);font-size:9px;color:var(--ink-3);letter-spacing:0;font-variant-numeric:tabular-nums}
.cd.l1{background:var(--fill,#d6ece4);border-color:transparent}
.cd.l2{background:var(--fill,#a9dccd);border-color:transparent}
.cd.l3{background:var(--fill,#4fbfa3);border-color:transparent}
.cd.l4{background:var(--fill,#1f8e75);border-color:transparent}
.cd.l1 .n,.cd.l2 .n{color:var(--ink)}
.cd.l3 .n,.cd.l4 .n{color:#fff}
.cd.l3 .h,.cd.l4 .h{color:rgba(255,255,255,.88)}
.cd.future .n{color:var(--ink-3)}
.cd.future{background:repeating-linear-gradient(45deg,transparent,transparent 5px,rgba(31,140,117,.06) 5px,rgba(31,140,117,.06) 6px)}
.cd.today{box-shadow:0 0 0 2px var(--accent) inset,0 0 0 4px var(--accent-soft)}
.cd.today .n{color:var(--accent-2);font-weight:800}
.cd.sel{box-shadow:0 0 0 2px var(--accent) inset,0 8px 18px -8px rgba(31,169,140,.45);transform:translateY(-2px);border-color:var(--accent)}
.cal-legend{display:flex;align-items:center;gap:7px;margin-top:16px;font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;flex-wrap:wrap}
.cal-legend i{width:11px;height:11px;display:inline-block;border-radius:3px;border:1px solid rgba(31,140,117,.18)}
.cal-legend i.e0{background:var(--card);border:1px solid var(--hair)}
.day-detail{background:var(--card-2);border:1px solid var(--line);padding:16px 20px;margin-top:16px;border-radius:var(--r)}
.day-detail h4{font-size:16px;font-weight:800;display:flex;align-items:baseline;gap:10px;letter-spacing:.04em;padding-bottom:10px;border-bottom:1px solid var(--hair)}
.day-detail h4 .tot{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--accent-2);font-weight:700;background:var(--accent-soft);padding:2px 10px;border-radius:999px}
.sess-chip{display:inline-flex;align-items:center;gap:6px;margin:6px 7px 0 0;padding:4px 10px;
  border:1px solid var(--hair);border-left:4px solid var(--c);font-family:var(--mono);font-size:11px;color:var(--ink);
  background:#fff;cursor:pointer;border-radius:999px;transition:all .15s}
.sess-chip i{width:8px;height:8px;border-radius:2px;background:var(--c);flex:none}
.sess-chip:hover{border-color:var(--c);box-shadow:var(--shadow-sm);transform:translateY(-1px)}
.sess-chip.editing{gap:4px;padding:6px 9px;background:var(--card);flex-wrap:wrap;cursor:default;border:1px solid var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sess-chip.run{border-style:dashed;background:var(--card-2)}
.dd-warn{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--danger);margin-top:8px}
.dd-warn b{font-variant-numeric:tabular-nums;background:rgba(192,80,77,.12);padding:0 3px;border-radius:4px}
.ce-d,.ce-t,.ce-dur{
  font-family:var(--mono);font-size:11px;color:var(--ink);font-variant-numeric:tabular-nums;
  border:1px solid var(--line);background:var(--card);padding:3px 5px;outline:none;border-radius:var(--r-sm);transition:border-color .15s,box-shadow .15s;
}
.ce-d:focus,.ce-t:focus,.ce-dur:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ce-dur{width:52px;text-align:center}
.ce-sep{color:var(--ink-3);font-size:11px;font-family:var(--mono)}
.ce-ok,.ce-no,.ce-del{border:1px solid var(--line);background:#fff;font-family:var(--mono);font-size:10.5px;cursor:pointer;color:var(--ink-2);padding:2px 7px;letter-spacing:.04em;border-radius:var(--r-sm);transition:all .14s}
.ce-ok{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.ce-ok:hover{filter:brightness(1.06)}
.ce-no:hover,.ce-del:hover{background:var(--danger);border-color:var(--danger);color:#fff}
.ev .t.edt{margin-left:auto;align-self:center;cursor:pointer;border-bottom:1px dashed var(--hair);border-radius:4px}
.ev .t.edt:hover{color:var(--accent-2);border-color:var(--accent);background:var(--accent-soft)}
.dd-hint{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink-3);margin-top:8px;text-transform:uppercase}
.rank{display:flex;flex-direction:column;gap:13px}
.rank-item{display:flex;align-items:center;gap:11px}
.rank-item .nm{width:78px;font-size:13.5px;flex:none;display:flex;align-items:center;gap:7px;color:var(--ink);font-weight:600;letter-spacing:.02em}
.rank-item .nm i{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.rank-item .bar{flex:1;height:14px;background:var(--paper-2);border:1px solid var(--hair);border-radius:999px;overflow:hidden}
.rank-item .bar i{display:block;height:100%;background:var(--c);min-width:4px;border-radius:999px;transition:width .6s var(--ease)}
.rank-item .v{width:76px;font-family:var(--mono);font-size:12px;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums;flex:none;font-weight:700}
.month-evs{display:flex;flex-direction:column;max-height:520px;overflow:auto;scrollbar-width:thin}
.mday{display:flex;gap:13px;padding:10px 4px}
.mday+.mday{border-top:1px dashed var(--hair)}
.mday .d{font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--accent-2);flex:none;width:58px;text-align:center;
  height:fit-content;padding:2px 0;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 25%,var(--hair));border-radius:var(--r-sm);margin-top:2px;letter-spacing:.02em}
.mday .body{flex:1;min-width:0}
.mday .ev-row{display:flex;gap:9px;padding:3px 0;font-size:14.5px;align-items:baseline}
.mday .ev-row .t{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);flex:none;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.mday .ev-row::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--ink-3);flex:none;align-self:center}
.mday .ev-row.mile{font-weight:700}
.mday .ev-row.mile::before{background:var(--accent);border:1px solid var(--accent-2);transform:rotate(45deg)}

/* ============ 对账弹层 ============ */
.veil{display:none;position:fixed;inset:0;background:rgba(30,38,35,.42);z-index:50;backdrop-filter:blur(6px)}
.veil.show{display:block}
.modal{
  display:none;position:fixed;z-index:51;left:50%;top:50%;transform:translate(-50%,-50%);
  background:linear-gradient(160deg,rgba(255,255,255,.97),rgba(246,249,248,.94));backdrop-filter:blur(16px);
  border:1px solid var(--line);width:min(500px,92vw);border-radius:var(--r-lg);
  box-shadow:var(--shadow-lg);overflow:hidden;
}
.modal.show{display:block;animation:rise .24s var(--ease)}
@keyframes rise{from{opacity:0;transform:translate(-50%,-46%) scale(.97)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.modal .mhead{
  background:linear-gradient(140deg,var(--accent),var(--accent-2));padding:15px 24px;color:#fff;
  font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.2em;
  display:flex;align-items:center;gap:10px;text-transform:uppercase;
}
.modal .mhead::before{content:"";width:9px;height:9px;background:#fff;border-radius:50%}
.modal .mbody{padding:24px 26px 22px}
.modal .mb-t{font-size:19px;font-weight:800;margin-bottom:6px;letter-spacing:.02em}
.modal .mb-s{color:var(--ink-2);font-size:14px;margin-bottom:22px;line-height:1.8}
.modal .mb-s b{color:var(--accent-2);background:var(--accent-soft);padding:0 5px;border-radius:4px}
.mbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

<script>
'use strict';
/* ================= 数据层 ================= */
var KEY='xilu.studyLog';
var PALETTE=['#2b6fe0','#df3e77','#7b5cf6','#12a3a6','#16a45c','#0e7fc0','#e0452e','#dfa314','#3f3f8f','#e07b2e','#0d8f9c','#c026a8','#6d6a1f','#1e8a7a','#9c4dcc'];
/* 固定四个事项，各自鲜艳色（首页只保留这四个，不提供新增 / 管理） */
var SUBJECT_DEFS=[
  {id:'interview',name:'面试',color:'#ffb3cf'},
  {id:'proj',name:'项目',color:'#7b5cf6'},
  {id:'algo',name:'算法',color:'#ff7a45'},
  {id:'tidy',name:'整理',color:'#4fbfa3'}
];
var SUBJECT_IDS={};SUBJECT_DEFS.forEach(function(s){SUBJECT_IDS[s.id]=1;});
var store=load();
function load(){
  var raw;
  try{raw=localStorage.getItem(KEY);}catch(e){return fresh();} // 存储被禁（隐私模式）：起个新数据
  if(!raw)return fresh();
  var s;
  try{s=JSON.parse(raw);}
  catch(e){
    // JSON 损坏：先备份原串再重建，避免下个 save() 把坏数据覆写、历史彻底无痕
    try{localStorage.setItem(KEY+'.corrupt',raw);}catch(_){}
    console.warn('习录数据损坏，已备份至 '+KEY+'.corrupt 并重置');
    return fresh();
  }
  if(!s||!Array.isArray(s.subs)||!s.days||typeof s.days!=='object'||Array.isArray(s.days))return fresh();
  // active 是「是否在计时」的运行时状态，不是必备结构：收工后为 null 属正常，判成坏数据会导致重开即清库。
  if(!s.active||typeof s.active!=='object'||typeof s.active.sub!=='string'||typeof s.active.from!=='number')s.active=null;
  normalize(s);   // 读进来就是当前形状：不留版本号，每次加载都无差别收敛（幂等）
  return s;
}
function normalize(s){
  Object.keys(s.days).forEach(function(k){
    var d=s.days[k];if(!d)return;
    if(d.sess){
      d.sess=d.sess.filter(function(x){return x.sub!=='en';});
      d.sess.forEach(function(x){if(!SUBJECT_IDS[x.sub])x.sub='interview';}); // 未知事项收归面试
    }
    if(d.evs)d.evs=d.evs.filter(function(x){return (x.kind||'note')!=='learn';}); // 记知识点（kind:'learn'）已移除，旧条目收敛时一并清掉
  });
  if(s.active&&!SUBJECT_IDS[s.active.sub])s.active=null;
  s.subs=SUBJECT_DEFS.map(function(x){return{id:x.id,name:x.name,color:x.color};});
}
function fresh(){
  return {
    subs:SUBJECT_DEFS.map(function(x){return{id:x.id,name:x.name,color:x.color};}),
    days:{},
    active:null,
    beat:Date.now()
  };
}
function save(){
  try{store.beat=Date.now();localStorage.setItem(KEY,JSON.stringify(store));}
  catch(e){console.warn('习录保存失败',e);toast('保存失败：浏览器存储不可用或已满');}
}
function dayKey(d){var y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+dd;}
function todayKey(){return dayKey(new Date());}
function getDay(k){if(!store.days[k])store.days[k]={sess:[],evs:[]};return store.days[k];}
function subOf(id){for(var i=0;i<store.subs.length;i++)if(store.subs[i].id===id)return store.subs[i];return null;}
function subColor(id){var s=subOf(id);return s?s.color:'#8FA6A2';}
function subName(id){var s=subOf(id);return s?s.name:'归档事项';}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

/* 会话跨午夜拆分 */
function pushSessions(from,to,sub){
  var cur=new Date(from),end=new Date(to);
  while(cur<end){
    var dayEnd=new Date(cur);dayEnd.setHours(24,0,0,0);
    var cut=Math.min(end.getTime(),dayEnd.getTime());
    if(cut-cur>0){
      var k=dayKey(cur);
      getDay(k).sess.push({sub:sub,from:cur.getTime(),to:cut});
    }
    cur=new Date(cut);
  }
}
function fmtHMin(ms){
  var s=Math.round(ms/1000);
  if(s<60)return Math.max(s,1)+' 秒';           // 不足 1 分钟的短段显示秒
  var m=Math.floor(ms/60000),h=Math.floor(m/60);
  if(h>0)return h+'h'+(m%60?String(m%60).padStart(2,'0')+'m':'');
  return m+' 分钟';
}
function fmtDur(ms){
  var s=Math.floor(ms/1000);
  var h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0');
}
function fmtClock(ms){var d=new Date(ms);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function dayMs(k){var d=store.days[k];if(!d)return 0;var t=0;d.sess.forEach(function(s){t+=s.to-s.from;});return t;}
function dayTotal(activeMs){
  var t=dayMs(todayKey());
  if(activeMs>0)t+=activeMs;
  return t;
}

/* ================= 工具 ================= */
var $=function(id){return document.getElementById(id);};
/* 进场动画：按渲染顺序错峰，backwards 让静止态（hover/.on 位移）不被覆盖 */
function reveal(el,i,step){
  el.style.animation='riseUp .5s var(--ease) backwards';
  el.style.animationDelay=((step||55)*i)+'ms';
}
var toastTimer=null;
function toast(html){
  var t=$('toast');t.innerHTML=html;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show');},2600);
}

/* ================= 今日屏 ================= */
var curActive=store.active;

function renderSubs(){
  var g=$('subjGrid');g.innerHTML='';
  var tk=todayKey(),today=getDay(tk);
  var acc={},wacc={},dayMap={};
  today.sess.forEach(function(s){acc[s.sub]=(acc[s.sub]||0)+s.to-s.from;});
  // 近 7 天累计（含今天；卡片上展示的是扣除今天后的「前6日」）
  var d0=new Date();d0.setDate(d0.getDate()-6);d0.setHours(0,0,0,0);
  var d0k=dayKey(d0);
  var days7=[];for(var di=0;di<7;di++){var dx=new Date(d0);dx.setDate(d0.getDate()+di);days7.push(dayKey(dx));}
  Object.keys(store.days).forEach(function(k){
    if(k<d0k||k>tk)return;
    dayMap[k]={};
    store.days[k].sess.forEach(function(s){wacc[s.sub]=(wacc[s.sub]||0)+s.to-s.from;dayMap[k][s.sub]=(dayMap[k][s.sub]||0)+s.to-s.from;});
  });
  store.subs.forEach(function(s,idx){
    var on=curActive&&curActive.sub===s.id;
    var el=document.createElement('button');
    el.className='subj'+(on?' on':'');
    el.style.setProperty('--c',s.color);
    var t=acc[s.id]||0,wt=wacc[s.id]||0,past=wt-t;
    // 只展示今天以前的部分，与「今日」互补不重叠；独立成行，不再挤在今日同一行里；不足 1 分钟的零头不值得占一行
    var wk=past>=60000?'<span class="wk">前6日 '+fmtHMin(past)+'</span>':'';
    // 近 7 日迷你柱（含今天），按比例拉伸，零投入仅留 3px 基条
    var bars=days7.map(function(k){return dayMap[k]?dayMap[k][s.id]||0:0;});
    var mx=Math.max.apply(null,bars.concat([1]));
    var spark='<div class="spark">'+bars.map(function(b){
      return '<i class="'+(b>0?'on':'')+'" style="height:'+(b>0?Math.max(12,Math.round(b/mx*100)):3)+'%"></i>';
    }).join('')+'</div>';
    el.innerHTML='<span class="nm">'+s.name+'</span><span class="tm"><b>'+
      (t>0?fmtHMin(t):'—')+'</b><span>今日</span></span>'+wk+spark+
      '<button class="x" data-del="'+s.id+'" title="删除事项">✕</button>';
    if(on)el.title='正在计时 · 再点一次结束收工';
    else el.title='开始 / 切换到 '+s.name;
    el.addEventListener('click',function(e){
      if(e.target.getAttribute('data-del'))return;
      if(e.target.closest('.x'))return;
      activate(s.id);
    });
    reveal(el,idx,60);
    g.appendChild(el);
  });
  // 统一面试：不再提供「新增事项」入口
  var x=document.querySelectorAll('.subj .x');
  for(var i=0;i<x.length;i++)x[i].addEventListener('click',function(e){
    e.stopPropagation();
    var id=this.getAttribute('data-del');
    if(!confirm('删除事项「'+subName(id)+'」？正在进行的这段会先收工；历史记录将显示为「归档事项」，不影响已有统计。'))return;
    if(curActive&&curActive.sub===id)settle(Date.now()); // 该科正在计时 → 先落账再删，别静默丢段
    store.subs=store.subs.filter(function(s){return s.id!==id;});
    save();renderSubs();renderClock();renderSess();
  });
  renderSubChips();
}

function activate(id){
  var now=Date.now();
  if(curActive){
    if(curActive.sub===id){
      // 再点当前 = 收工（必须落账，否则这段凭空消失）
      var from=curActive.from;
      settle(now);
      save();renderClock();renderSubs();renderSess();
      toast('收工 · <b>'+fmtHMin(now-from)+'</b> 已入账 '+subName(id));
      return;
    }
    settle(now);
  }
  curActive={sub:id,from:now};
  store.active=curActive;
  save();renderSubs();renderClock();renderSess();
}
function settle(to){
  if(!curActive)return;
  var d=to-curActive.from;
  if(d>2000)pushSessions(curActive.from,to,curActive.sub); // <2s 视为双击误触；几十秒的真实短段正常入账
  curActive=null;store.active=null;
}
/* 收工按钮：显式结束当前段（与「再点当前事项」等价） */
function stopNow(){
  if(!curActive)return;
  var from=curActive.from,nm=subName(curActive.sub);
  settle(Date.now());
  save();renderClock();renderSubs();renderSess();
  toast('收工 · <b>'+fmtHMin(Date.now()-from)+'</b> 已入账 '+nm);
}
$('stopBtn').addEventListener('click',stopNow);

/* ---- 时辰刻度仪：把今日已记（含进行中）按事项色涂进 24 小时 ---- */
function renderHourRail(){
  var tk=todayKey(),d0=new Date();d0.setHours(0,0,0,0);
  var t0=d0.getTime(),t1=t0+86400000;
  var day=getDay(tk);
  var entries=day.sess.slice();
  if(curActive){
    entries.push({sub:curActive.sub,from:curActive.from,to:Math.min(Date.now(),t1)});
  }
  var bins=[];for(var i=0;i<24;i++)bins.push([]);
  var totalMin=0;
  entries.forEach(function(s){
    var a=Math.max(s.from,t0),b=Math.min(s.to,t1);
    if(b<=a)return;
    var ma=Math.floor((a-t0)/60000),mb=Math.ceil((b-t0)/60000);
    for(var h=0;h<24;h++){
      var hs=h*60,he=(h+1)*60;
      var s1=Math.max(ma,hs),s2=Math.min(mb,he);
      if(s2>s1)bins[h].push({sub:s.sub,off:s1-hs,len:s2-s1});
    }
  });
  var rail=$('hourRail');rail.innerHTML='';
  for(var h=0;h<24;h++){
    var col=document.createElement('div');col.className='hx';
    var segs=bins[h];
    if(segs.length){
      var stack=document.createElement('div');stack.className='stack';
      segs.forEach(function(g){
        var bar=document.createElement('div');bar.className='seg';
        bar.style.background=subColor(g.sub);
        bar.style.height=Math.max(1.5,g.len/60*100)+'%';
        bar.title=subName(g.sub)+' · '+g.len+' 分钟';
        stack.appendChild(bar);
      });
      col.appendChild(stack);
    }
    col.title=h+' 点';
    rail.appendChild(col);
  }
  var tt=$('railTot');
  tt.textContent=fmtClock(Date.now())+' · 已记 '+fmtHMin(dayMs(tk)).replace(/ /g,'')+(curActive?' · 含进行中':'');
  // 刻度标签（一次性）
  var rk=$('railTicks');
  if(!rk.children.length){
    var labs={0:'0',6:'6',12:'12',18:'18',23:'24'};
    for(var h=0;h<24;h++){
      var sp=document.createElement('span');
      sp.textContent=labs[h]!==undefined?labs[h]:'';
      sp.className=labs[h]!==undefined?'m':'k';
      rk.appendChild(sp);
    }
  }
  drawRailNow(new Date());
}
function drawRailNow(d){
  var line=$('railNow');
  var min=d.getHours()*60+d.getMinutes()+d.getSeconds()/60;
  line.style.left=(min/1440*100)+'%';
  line.style.opacity=1;
}

/* ================= 时钟区 ================= */
function renderClock(){
  var run=curActive;
  var card=document.querySelector('.clock-card');
  var stateTxt=$('clockStateTxt'),dot=$('pulseDot'),big=$('clockBig'),sub=$('clockSub'),stop=$('stopBtn');
  if(run){
    var s=subOf(run.sub);
    var col=s?s.color:'#C0504D';
    card.style.setProperty('--cc',col);
    card.classList.add('run');
    dot.className='pulse run';
    stop.className='stop-btn show';
    if(s)stateTxt.innerHTML='正在计时 <span class="sub-name">'+s.name+'</span>';
    else stateTxt.textContent='正在计时 · 归档事项';
    big.classList.remove('idle');
    tick();
  }else{
    card.style.removeProperty('--cc'); // 未计时：回落 CSS 的霓虹青
    card.classList.remove('run');
    dot.className='pulse';
    stop.className='stop-btn';
    stateTxt.textContent='未在计时 · 点事项开始';
    var t=dayMs(todayKey());
    big.textContent=fmtDur(t);
    big.classList.add('idle');
    sub.innerHTML='今日已入账 <b>'+fmtHMin(t)+'</b>'+(t?' · 再学一段，把时间刻进今天':' · 从点一个事项开始');
  }
  renderHourRail();
}
function tick(){
  var run=curActive;if(!run)return;
  var d=Date.now()-run.from;
  $('clockBig').textContent=fmtDur(d);
  $('clockBig').classList.remove('idle');
  var total=dayTotal(d);
  $('clockSub').innerHTML='本段 '+fmtHMin(d)+' · 今日合计 <b>'+fmtHMin(total)+'</b>';
}
setInterval(tick,1000);
setInterval(function(){if(store.active||document.hidden===false)save();},15000);
/* 时辰刻度针 15s 走一格（分钟级动效无需逐秒） */
setInterval(function(){
  var v=$('viewToday');
  if(v&&v.style.display!=='none'){renderHourRail();}
},15000);

/* ---- 今日流水 ---- */
function renderSess(){
  var box=$('sessList');
  var d=getDay(todayKey());
  box.innerHTML='';
  if(!d.sess.length){
    var e=document.createElement('div');e.className='empty-hint';
    e.innerHTML='还没有时段 —— <b>点一个事项</b>，计时即开始。<br>学完点 <b>事项</b> 或右上 <b>收工</b> 落账。';
    box.appendChild(e);
  }
  d.sess.slice().sort(function(a,b){return a.from-b.from;}).forEach(function(s,idx){
    var row=document.createElement('div');row.className='sess';
    row.style.setProperty('--c',subColor(s.sub));
    row.innerHTML='<span class="c"></span><span class="rng">'+fmtClock(s.from)+'–'+fmtClock(s.to)+'</span>'+
      '<span class="who">'+subName(s.sub)+'</span><span class="dur">'+fmtHMin(s.to-s.from).replace(/ /g,'')+'</span>'+
      '<button class="sess-edit" title="修改时间">改</button>'+
      '<button class="sess-del" title="删除">✕</button>';
    row.querySelector('.sess-edit').addEventListener('click',function(){openSessEdit(s,d,row);});
    row.querySelector('.sess-del').addEventListener('click',function(){
      d.sess.splice(d.sess.indexOf(s),1);save();renderSess();renderSubs();renderClock();
      toast('已删除一段');
    });
    reveal(row,idx,42);
    box.appendChild(row);
  });
}
/* 改已落账时段的时间（同一天内，input[type=time] 天然限制） */
function openSessEdit(s,d,row){
  row.className='sess editing';
  row.innerHTML='<span class="c"></span>'+
    '<span class="rng"><input type="time" class="tm a" value="'+fmtClock(s.from)+'">–<input type="time" class="tm b" value="'+fmtClock(s.to)+'"></span>'+
    '<span class="who">'+subName(s.sub)+'</span>'+
    '<button class="sess-edit" data-a="ok" title="保存">存</button>'+
    '<button class="sess-edit" data-a="no" title="取消">✕</button>';
  var a=row.querySelector('.tm.a'),b=row.querySelector('.tm.b');
  var close=function(){renderSess();renderSubs();renderClock();};
  row.querySelector('[data-a="ok"]').addEventListener('click',function(){
    var fa=a.value.split(':'),tb=b.value.split(':');
    if(fa.length!==2||tb.length!==2){alert('请填完整时间');return;}
    var base=new Date(s.from);
    var from=new Date(base);from.setHours(+fa[0],+fa[1],0,0);
    var to=new Date(base);to.setHours(+tb[0],+tb[1],0,0);
    if(to<=from){var tmp=to;to=from;from=tmp;}
    if(to-from<60000){alert('至少 1 分钟');return;}
    if(to.getTime()>Date.now()+60000){alert('结束时间不能在未来');return;}
    if(curActive&&to.getTime()>curActive.from){alert('与正在计时的时段重叠');return;}
    s.from=from.getTime();s.to=to.getTime();
    save();toast('已改为 <b>'+fmtClock(s.from)+'–'+fmtClock(s.to)+'</b>');
    close();
  });
  row.querySelector('[data-a="no"]').addEventListener('click',close);
  a.focus();
}

/* ---- 今日札记 / 今日所学 ---- */
function renderEv(){
  var d=getDay(todayKey());
  var box=$('evList');box.innerHTML='';
  if(!d.evs.length){
    var e=document.createElement('div');e.className='empty-hint';
    e.textContent='今天还没有札记 —— 完成一件事，就回来记一笔。';
    box.appendChild(e);
  }
  [['mile','里程碑'],['note','碎碎念']].forEach(function(g){
    var list=d.evs.filter(function(ev){return (ev.kind||'note')===g[0];})
                  .sort(function(a,b){return a.t-b.t;});
    if(!list.length)return;
    var h=document.createElement('div');
    h.className='evgrp g-'+g[0];
    h.textContent=g[1]+' · '+list.length;
    box.appendChild(h);
    list.forEach(function(ev,i){var r=evRow(ev,d);reveal(r,i,42);box.appendChild(r);});

}
function evRow(ev,d){
    var kind=ev.kind||'note';
    var row=document.createElement('div');row.className='ev '+(kind==='mile'?'k-mile':'k-note');
    var stamp='<span class="stamp" title="点一下切换 里程碑 / 碎碎念"></span>';
    row.innerHTML=stamp+
      '<div class="bdy"><div class="txt"></div><div class="t">'+fmtClock(ev.t)+'</div></div>'+
      '<button class="del" title="删除">✕</button>';
    row.querySelector('.txt').textContent=ev.text;
    row.querySelector('.stamp').addEventListener('click',function(){
      ev.kind=isMile(ev)?'note':'mile';save();renderEv();
      toast(isMile(ev)?'标为 <b>里程碑</b>':'改为 <b>碎碎念</b>');
    });
    row.querySelector('.del').addEventListener('click',function(){
      d.evs.splice(d.evs.indexOf(ev),1);save();renderEv();
      toast('已删除');
    });
    return row;
}

/* 补录 · 24h 时间轴区间选择 */
var addFrom=0,addTo=0;          // 距 0 点的分钟数
var TL_MIN=5;                    // 吸附粒度（分钟）
function tlPct(min){return min/1440*100;}
function snapMin(min){min=Math.round(min/TL_MIN)*TL_MIN;return Math.max(0,Math.min(1440,min));}
function fmtHM(min){var h=Math.floor(min/60),m=min%60;return ('0'+h).slice(-2)+':'+('0'+m).slice(-2);}
/* 与今日已落账时段是否重叠（仅提示，不阻断） */
function tlOverlap(a,b){
  var d=getDay(todayKey());
  for(var i=0;i<d.sess.length;i++){var s=d.sess[i];if(a<s.to&&b>s.from)return true;}
  return false;
}
/* 现在之前、未被占用的最大空隙 */
function largestGapBefore(nowm){
  var t0=new Date();t0.setHours(0,0,0,0);var base=t0.getTime();
  var sess=getDay(todayKey()).sess.slice();
  if(curActive)sess.push({from:curActive.from,to:Date.now()});
  sess.sort(function(a,b){return a.from-b.from;});
  var cur=0,best=null,bestLen=0;
  for(var i=0;i<sess.length;i++){
    var s=sess[i];if(s.from>base+nowm*60000)break;
    var a=Math.max(0,(s.from-base)/60000);
    if(a-cur>bestLen){bestLen=a-cur;best={a:cur,b:a};}
    cur=Math.max(cur,Math.min((s.to-base)/60000,nowm));
  }
  if(nowm-cur>bestLen){bestLen=nowm-cur;best={a:cur,b:nowm};}
  return best&&bestLen>=TL_MIN?best:null;
}
function setSel(from,to){
  from=snapMin(from);to=snapMin(to);
  if(from>to){var t=from;from=to;to=t;}
  if(to-from<TL_MIN)to=from+TL_MIN;
  if(to>1440){to=1440;from=to-TL_MIN;}
  if(from<0){from=0;to=TL_MIN;}
  addFrom=from;addTo=to;paintSel();updateRead();
}
function paintSel(){
  $('tlFrom').style.left=tlPct(addFrom)+'%';
  $('tlTo').style.left=tlPct(addTo)+'%';

function applyPreset(p){
  var now=new Date(),nm=now.getHours()*60+now.getMinutes();
  if(p==='hour')setSel(Math.max(0,nm-60),nm);
  else if(p==='now')setSel(Math.max(0,nm-30),nm);
  else if(p==='am'){var ae=Math.min(12*60,nm);if(ae>9*60)setSel(9*60,ae);else setSel(Math.max(0,nm-60),nm);}
  else if(p==='pm'){var pe=Math.min(18*60,nm);if(pe>14*60)setSel(14*60,pe);else setSel(Math.max(0,nm-60),nm);}
  else if(p==='night'){var ne=Math.min(23*60,nm);if(ne>20*60)setSel(20*60,ne);else setSel(Math.max(0,nm-60),nm);}
  else if(p==='gap'){
    var g=largestGapBefore(nm);
    if(g)setSel(g.a,g.b);else setSel(Math.max(0,nm-60),nm);
  }
}

function tlInit(){
  var tks=$('tlTicks');tks.innerHTML='';
  var labs={0:'0',3:'3',6:'6',9:'9',12:'12',15:'15',18:'18',21:'21',23:'24'};
  for(var h=0;h<24;h++){
    var sp=document.createElement('span');
    sp.textContent=labs[h]!==undefined?labs[h]:'';
    sp.className=labs[h]!==undefined?'lab':'tk';
    tks.appendChild(sp);
  }
  var track=$('tlTrack'),drag=null;
  function pos(e){var r=track.getBoundingClientRect();var x=(e.clientX-r.left)/r.width*1440;return snapMin(x);}
  function cap(e){if(track.setPointerCapture){try{track.setPointerCapture(e.pointerId);}catch(_){}}}
  $('tlFrom').addEventListener('pointerdown',function(e){drag='from';cap(e);e.preventDefault();e.stopPropagation();});
  $('tlTo').addEventListener('pointerdown',function(e){drag='to';cap(e);e.preventDefault();e.stopPropagation();});
  track.addEventListener('pointerdown',function(e){
    var m=pos(e);
    if(Math.abs(m-addFrom)<=Math.abs(m-addTo))setSel(m,addTo);else setSel(addFrom,m);
    drag='move';cap(e);e.preventDefault();
  });
  track.addEventListener('pointermove',function(e){
    if(!drag)return;
    var m=pos(e);
    if(drag==='from')setSel(Math.min(m,addTo-TL_MIN),addTo);
    else if(drag==='to')setSel(addFrom,Math.max(m,addFrom+TL_MIN));
    else{var len=addTo-addFrom,st=Math.max(0,Math.min(1440-len,m-len/2));setSel(st,st+len);}
  });
  function up(){drag=null;}
  track.addEventListener('pointerup',up);
  track.addEventListener('pointercancel',up);
  window.addEventListener('pointerup',up);
  $('tlPresets').querySelectorAll('.pre').forEach(function(b){
    b.addEventListener('click',function(){applyPreset(b.dataset.p);});
  });
}

function buildTime(dstr,tstr){
  var dp=(dstr||'').split('-'),hm=/^(\d{1,2}):(\d{2})$/.exec(tstr||'');
  if(dp.length!==3||!hm)return null;
  var h=+hm[1],mi=+hm[2];
  if(h>23||mi>59)return null;
  var d=new Date(+dp[0],+dp[1]-1,+dp[2],h,mi,0,0);
  // 挡掉 2 月 31 日这类溢出（Date 会自动进位到 3 月 3 日）
  return (isNaN(d.getTime())||d.getDate()!==+dp[2]||d.getMonth()!==+dp[1]-1)?null:d;
}
function refreshReview(touchToday){
  renderReview();renderRank();renderMonthEvs();
  if(touchToday){renderSess();renderClock();renderSubs();}
}
/* 日期 key → 当天 0 点 / 23:59:59.999 */
function keyDate(k,end){
  var p=k.split('-');
  return end?new Date(+p[0],+p[1]-1,+p[2],23,59,59,999):new Date(+p[0],+p[1]-1,+p[2],0,0,0,0);
}
/* 同一天里互相重叠的分钟数（补录压到已有时段上时常用） */
function dayOverlap(sess){
  var a=sess.slice().sort(function(x,y){return x.from-y.from;}),ov=0,end=-Infinity;
  a.forEach(function(s){if(s.from<end)ov+=Math.min(end,s.to)-s.from;end=Math.max(end,s.to);});
  return ov;
}
/* "90" / "1:30" / "1h30" → 分钟；认不出来返回 null */
function parseDur(v){
  v=(v||'').trim();
  var m=/^(\d+)\s*(?:[:hH]|小?时)\s*(\d{1,2})/.exec(v);
  if(m)return +m[1]*60+ +m[2];
  return /^\d+(\.\d+)?$/.test(v)?Math.round(+v):null;
}
function dropEmptyDay(k){
  var d=store.days[k];
  if(d&&!d.sess.length&&!d.evs.length)delete store.days[k];
}
function openChipEdit(s,oldKey,chip){
  chip.classList.add('editing');
  chip.innerHTML='<input type="date" class="ce-d" value="'+dayKey(new Date(s.from))+'">'+
    '<input type="time" class="ce-t" value="'+fmtClock(s.from)+'"><span class="ce-sep">–</span>'+
    '<input type="time" class="ce-t" value="'+fmtClock(s.to)+'">'+
    '<span class="ce-sep">时长</span><input class="ce-dur" value="'+Math.round((s.to-s.from)/60000)+'" title="分钟，也可写 1:30">分'+
    '<button class="ce-ok">存</button><button class="ce-del" title="删掉这一段">删</button><button class="ce-no">✕</button>';
  var inps=chip.querySelectorAll('input'),dI=inps[0],aI=inps[1],bI=inps[2],uI=inps[3];
  // 时长 ⇄ 结束时间 双向联动：改时长就等于改「这一段有多长」
  var sync=function(src){
    var from=buildTime(dI.value,aI.value);if(!from)return;
    if(src==='dur'){
      var mn=parseDur(uI.value);if(mn===null||mn<1)return;
      var nt=new Date(from.getTime()+mn*60000);
      // 撞到午夜就卡在当天 23:59，跨天拆分不在这儿做
      if(dayKey(nt)!==dayKey(from))nt=new Date(from.getFullYear(),from.getMonth(),from.getDate(),23,59,0,0);
      bI.value=String(nt.getHours()).padStart(2,'0')+':'+String(nt.getMinutes()).padStart(2,'0');
    }else{
      var to=buildTime(dI.value,bI.value);
      if(!to||to<=from)return;
      uI.value=Math.round((to-from)/60000);
    }
  };
  aI.addEventListener('change',function(){sync('t');});
  bI.addEventListener('change',function(){sync('t');});
  uI.addEventListener('input',function(){sync('dur');});
  chip.querySelector('.ce-no').addEventListener('click',function(){renderDayDetail();});
  chip.querySelector('.ce-del').addEventListener('click',function(){
    if(!confirm('删掉这一段？（'+fmtClock(s.from)+'–'+fmtClock(s.to)+' '+subName(s.sub)+'）'))return;
    var od=store.days[oldKey];
    if(od){var i=od.sess.indexOf(s);if(i>=0)od.sess.splice(i,1);}
    dropEmptyDay(oldKey);save();
    toast('已删除一段');
    refreshReview(oldKey===todayKey());
  });
  chip.querySelector('.ce-ok').addEventListener('click',function(){
    var from=buildTime(inps[0].value,inps[1].value),to=buildTime(inps[0].value,inps[2].value);
    if(!from||!to){toast('时间填完整');return;}
    if(to<=from){var x=to;to=from;from=x;}
    if(to-from<60000){toast('至少 1 分钟');return;}
    if(to.getTime()>Date.now()+60000){toast('结束时间不能在未来');return;}
    if(curActive&&to.getTime()>curActive.from){toast('与正在计时的时段重叠');return;}
    // ponytail: 跨午夜不拆分（要拆走 pushSessions），遇到就让用户拆成两段
    if(dayKey(to)!==dayKey(from)){toast('暂不支持跨午夜 —— 请拆成两段');return;}
    var nk=dayKey(from),od=store.days[oldKey];
    if(od){var i=od.sess.indexOf(s);if(i>=0)od.sess.splice(i,1);}
    getDay(nk).sess.push({sub:s.sub,from:from.getTime(),to:to.getTime()});
    if(nk!==oldKey)dropEmptyDay(oldKey);
    selDay=nk;save();
    toast('已改为 <b>'+fmtClock(from)+'–'+fmtClock(to)+'</b>');
    refreshReview(oldKey===todayKey()||nk===todayKey());
  });
  inps[1].focus();
}
function openEvTimeEdit(ev,oldKey,row){
  var t=new Date(ev.t);
  row.innerHTML='<span class="stamp" style="width:9px;height:9px;border-radius:50%;margin-top:3px"></span>'+
    '<span class="txt" style="font-size:14px;flex:1">'+esc(ev.text)+'</span>'+
    '<input type="date" class="ce-d" value="'+dayKey(t)+'"><input type="time" class="ce-t" value="'+fmtClock(ev.t)+'">'+
    '<button class="ce-ok">存</button><button class="ce-no">✕</button>';
  var inps=row.querySelectorAll('input');
  row.querySelector('.ce-no').addEventListener('click',function(){renderDayDetail();});
  row.querySelector('.ce-ok').addEventListener('click',function(){
    var nt=buildTime(inps[0].value,inps[1].value);
    if(!nt){toast('时间填完整');return;}
    if(nt.getTime()>Date.now()+60000){toast('札记不能记到未来');return;}
    ev.t=nt.getTime();
    var nk=dayKey(nt),od=store.days[oldKey];
    if(nk!==oldKey&&od){
      var i=od.evs.indexOf(ev);if(i>=0)od.evs.splice(i,1);
      getDay(nk).evs.push(ev);
      dropEmptyDay(oldKey);
      selDay=nk;
    }
    save();toast('札记时间已改为 <b>'+fmtClock(ev.t)+'</b>');
    refreshReview(oldKey===todayKey()||nk===todayKey());
  });
  inps[1].focus();
}

function renderRank(){
  var box=$('rankBox');
  var acc={},tot=0;
  var y=calYM.y,m=calYM.m,dim=new Date(y,m+1,0).getDate();
  for(var dd=1;dd<=dim;dd++){
    var k=y+'-'+String(m+1).padStart(2,'0')+'-'+String(dd).padStart(2,'0');
    var d=store.days[k];if(!d)continue;
    d.sess.forEach(function(s){acc[s.sub]=(acc[s.sub]||0)+s.to-s.from;tot+=s.to-s.from;});
  }
  var arr=Object.keys(acc).map(function(id){return{id:id,t:acc[id]};}).sort(function(a,b){return b.t-a.t;});
  if(!arr.length){
    box.innerHTML='<div class="empty-hint">本月还没有计时记录。</div>';return;
  }
  box.innerHTML='';
  arr.forEach(function(o){
    var s=subOf(o.id);
    var row=document.createElement('div');row.className='rank-item';
    row.style.setProperty('--c',s?s.color:'#8FA6A2');
    var pct=Math.max(tot?o.t/tot*100:0,1.5);
    row.innerHTML='<span class="nm"><i></i>'+(s?s.name:'归档')+'</span><span class="bar"><i style="width:'+pct+'%"></i></span><span class="v">'+fmtHMin(o.t).replace(/ /g,'')+'</span>';
    reveal(row,i,70);
    box.appendChild(row);
  });
}

function renderMonthEvs(){
  var box=$('monthEvs');
  var y=calYM.y,m=calYM.m,dim=new Date(y,m+1,0).getDate();
  var days=[];
  for(var dd=dim;dd>=1;dd--){
    var k=y+'-'+String(m+1).padStart(2,'0')+'-'+String(dd).padStart(2,'0');
    if(store.days[k]&&store.days[k].evs.length)days.push(k);
  }
  var html='';
  [['mile','里程碑'],['note','碎碎念']].forEach(function(g){
    var body='',n=0;
    days.forEach(function(k){
      var list=store.days[k].evs.filter(function(ev){return (ev.kind||'note')===g[0];})
                                 .sort(function(a,b){return a.t-b.t;});
      if(!list.length)return;
      n+=list.length;
      var p=k.split('-');
      body+='<div class="mday"><div class="d">'+(+p[1])+'/'+p[2]+'</div><div class="body">';
      list.forEach(function(ev){
        body+='<div class="ev-row'+(g[0]==='mile'?' mile':'')+'"><span class="t">'+fmtClock(ev.t)+'</span><span>'+esc(ev.text)+'</span></div>';
      });
      body+='</div></div>';
    });
    if(body)html+='<div class="evgrp g-'+g[0]+'">'+g[1]+' · '+n+'</div>'+body;
  });
  if(!html)html='<div class="empty-hint">本月还没有札记。</div>';
  box.innerHTML=html;
  var me=box.children;for(var mi=0;mi<me.length;mi++)reveal(me[mi],mi,55);
}

/* ================= 对账 ================= */
function reconcile(){
  if(!store.active)return;
  var gap=Date.now()-store.beat;
  if(gap<10*60000)return;
  var s=subOf(store.active.sub);
  var title='「'+(s?s.name:'归档事项')+'」仍在计时';
  var sub='最后活动于 '+fmtClock(store.beat)+'，距今已 '+fmtHMin(gap).replace(/ /g,'')+'。';
  sub+='把这段学习结算掉，别让它虚增时长。';
  $('mTitle').textContent=title;
  $('mSub').innerHTML=sub;
  showModal();
}
$('mSettle').addEventListener('click',function(){
  curActive=store.active;
  var target=Math.min(store.beat,Date.now());
  if(curActive&&target>curActive.from){
    pushSessions(curActive.from,target,curActive.sub);
  }
  curActive=null;store.active=null;save();hideModal();renderSubs();renderClock();renderSess();
  toast('已结算');
});
$('mSettleNow').addEventListener('click',function(){
  var now=Date.now();
  if(curActive)settle(now);
  save();hideModal();renderSubs();renderClock();renderSess();
  toast('已结算到现在');
});
$('mDrop').addEventListener('click',function(){
  curActive=null;store.active=null;save();hideModal();renderSubs();renderClock();
  toast('已丢弃该段');
});
$('mKeep').addEventListener('click',function(){
  if(!store.active)return;
  curActive=store.active;
  store.beat=Date.now();
  save();hideModal();renderSubs();renderClock();
});
function showModal(){$('veil').classList.add('show');$('modal').classList.add('show');}
function hideModal(){$('veil').classList.remove('show');$('modal').classList.remove('show');}
$('veil').addEventListener('click',hideModal);

/* 心跳 + 嵌入 Vinea 时 Esc → 父级 */
window.addEventListener('pagehide',function(){save();});
document.addEventListener('visibilitychange',function(){
  if(document.hidden)save();
  else{store.beat=Date.now();save();}
});
var EMBED=false;
try{EMBED=window.self!==window.top;}catch(e){EMBED=true;}
if(EMBED){
  $('escTip').style.display='block';
  window.addEventListener('keydown',function(e){
    if(e.key==='Escape'){
      try{window.parent.postMessage('xilu-exit','*');}catch(_){}
    }
  });
}

/* ================= 导航 ================= */
$('navToday').addEventListener('click',function(){switchView('today');});
$('navReview').addEventListener('click',function(){switchView('review');});
function switchView(v){
  $('navToday').classList.toggle('on',v==='today');
  $('navReview').classList.toggle('on',v==='review');
  // 显式 block/none，别用 ''：CSS 有 .view.review{display:none}，
  // 清空内联样式会让回顾页永远被这条规则隐藏（点回顾 = 空白）
  $('viewToday').style.display=v==='today'?'block':'none';
  $('viewReview').style.display=v==='review'?'block':'none';
  if(v==='review'){renderReview();renderRank();renderMonthEvs();renderDayDetail();}
}
$('calPrev').addEventListener('click',function(){calYM.m--;if(calYM.m<0){calYM.m=11;calYM.y--;}refreshCal();});
$('calNext').addEventListener('click',function(){calYM.m++;if(calYM.m>11){calYM.m=0;calYM.y++;}refreshCal();});
function refreshCal(){
  var tk=todayKey();selDay=inViewMonth(tk)?tk:(lastDataInMonth()||tk);
  renderReview();renderRank();renderMonthEvs();
}
function lastDataInMonth(){
  var y=calYM.y,m=calYM.m,dim=new Date(y,m+1,0).getDate();
  for(var dd=dim;dd>=1;dd--){
    var k=y+'-'+String(m+1).padStart(2,'0')+'-'+String(dd).padStart(2,'0');
    if(store.days[k]&&store.days[k].sess.length)return k;
  }
  return null;
}

function refreshAll(){renderSubs();renderClock();renderSess();renderEv();renderReview();renderRank();renderMonthEvs();}

/* 页眉日期戳 */
function renderHeaderDate(){
  var wd=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  var d=new Date();
  $('dateNow').innerHTML=
    '<div class="dd">'+String(d.getMonth()+1).padStart(2,'0')+'<b>.</b>'+String(d.getDate()).padStart(2,'0')+'</div>'+
    '<div class="md">'+d.getFullYear()+' · '+wd[d.getDay()]+'</div>';
}

/* ================= 启动 ================= */
/* 地址带 ?wipe=1：打开即清空全部记录（自动先导出备份），随后抹掉参数避免刷新重复清空 */
if(/[?&]wipe=1\b/.test(location.search)){
  wipeAll(true);
  try{history.replaceState(null,'',location.pathname+location.hash);}catch(_){}
}
renderHeaderDate();
renderSubs();
renderClock();
renderSess();
renderEv();
switchView('today');
setTimeout(reconcile,600);

/* 自检：地址带 #t 时跑一遍时间解析（改时间这条链路唯一的解析点） */
if(location.hash==='#t'){
  var b1=buildTime('2026-09-05','09:30'),b2=buildTime('2026-02-31','09:30'),b3=buildTime('2026-09-05','25:00');
  console.assert(b1&&b1.getHours()===9&&b1.getMinutes()===30,'buildTime 正常解析');
  console.assert(b2===null,'buildTime 应拒绝 2/31');
  console.assert(b3===null,'buildTime 应拒绝 25:00');
  console.assert(parseDur('90')===90&&parseDur('1:30')===90&&parseDur('1h30')===90,'parseDur 三种写法');
  console.assert(parseDur('abc')===null,'parseDur 拒绝乱写');
  var H=3600000,ov=dayOverlap([{from:9*H,to:11*H},{from:10*H,to:12*H}]);
  console.assert(ov===H,'dayOverlap 应算出 1 小时重叠');
  console.assert(dayOverlap([{from:9*H,to:11*H},{from:11*H,to:12*H}])===0,'dayOverlap 首尾相接不算重叠');
  console.log('自检通过');
}
